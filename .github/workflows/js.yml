# SPDX-License-Identifier: MIT
# JavaScript port CI: test against the shared conformance vectors on every OS, publish to npm on tag.
name: js

on:
  push:
    branches: [main]
    paths: ["js/**", "conformance/**", ".github/workflows/js.yml"]
    tags: ["js-v*"]
  pull_request:
    paths: ["js/**", "conformance/**", ".github/workflows/js.yml"]

# One live run per branch or pull request: a push on top of a push cancels the run it
# replaced instead of finishing it against code nobody will merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: js

jobs:
  test:
    name: test (${{ matrix.os }} / node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["18", "20", "22"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Test (conformance vectors + property fuzz + adversarial suite)
        run: node --test

  # Publish to npm on a `js-vX.Y.Z` tag, with build provenance.
  # Published by Trusted Publishing (below): no NPM_TOKEN secret is needed or read.
  publish:
    name: publish to npm
    if: startsWith(github.ref, 'refs/tags/js-v')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Trusted Publishing (OIDC, set up on npmjs.com 20.10.2026: darwinscat/namz, js.yml, no environment): npm takes this
    # workflow's identity token instead of a stored secret — nothing to rotate. It needs id-token: write and npm 11.5.1+.
    # npm attaches provenance by itself on this path; a failed attempt can leave a Rekor entry that makes a retry of the
    # very same tarball answer 409, so a retry after a half-done publish needs a new version.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: npm with Trusted Publishing
        run: npm install -g npm@latest
      - name: Publish
        run: npm publish --access public
